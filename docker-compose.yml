version: '3.8'

services:
  sandbox:
    build: .
    ports:
      - "8088:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - DATABASE_URL=sqlite+aiosqlite:///./sandbox.db
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
      - ALLOW_USER_API_KEYS=${ALLOW_USER_API_KEYS}
      - CHALLENGE_FLAG=${CHALLENGE_FLAG}
      - MAX_PROMPT_LENGTH=${MAX_PROMPT_LENGTH}
    volumes:
      - ./data:/app/data  # Optional: persist data (if using a file-based DB outside container)
    # The container will run as non-root user (appuser) as defined in Dockerfile
    restart: unless-stopped